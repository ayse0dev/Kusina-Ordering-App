; PHP-FPM pool overrides (web requests only; artisan/queue/reverb are not affected).
; A web shell or injected code can't spawn processes: these functions are unavailable to web requests.
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

clear_env = no
catch_workers_output = yes

php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,show_source,highlight_file,dl
php_admin_flag[allow_url_include] = off
php_admin_flag[expose_php] = off
