; Production PHP settings for Kusina (layered over php.ini-production)
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
allow_url_include = Off
cgi.fix_pathinfo = 0

memory_limit = 256M
upload_max_filesize = 6M
post_max_size = 10M
max_execution_time = 30

session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0   ; code never changes inside a running container
